name: Bug report
description: Something doesn't work, looks wrong, or the app closed unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The two reports below let most problems be fixed without any back-and-forth.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "Exported a 4K D-Log clip at 1.33× with Re-encode; the app closed at 40%."
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where?
      options: [Clips, Frame, Look, Export, Settings, Device diagnostics, Installing / updating, Other]
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Export method (if relevant)
      options: [Not relevant, Lossless, Re-encode, Both]
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About shows it.
      placeholder: v1.8
    validations:
      required: true
  - type: input
    id: footage
    attributes:
      label: Footage
      description: Camera and the clip's badges (e.g. resolution, bit depth, log/HDR, codec).
      placeholder: "DJI Osmo Pocket 4, 3840×2160, 10-bit D-Log M, HEVC, 25 fps"
  - type: textarea
    id: crash
    attributes:
      label: Crash report (if the app closed)
      description: After a crash the app shows a report on next launch. Tap **Copy report** and paste it here.
      render: text
  - type: textarea
    id: diag
    attributes:
      label: Device diagnostics
      description: Settings → Device diagnostics → **Copy report**, then paste here.
      render: text
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: Drag images here (the Export step's Compatibility card is especially helpful).
