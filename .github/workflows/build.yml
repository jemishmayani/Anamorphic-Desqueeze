name: Build APK
on:
  push:
    # Tag pushes (releases) always build; documentation-only commits don't.
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/FUNDING.yml', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/FUNDING.yml', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # A newer push to the same branch cancels the older build; release tags are never cancelled.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::warning::No KEYSTORE_PASSWORD secret: building with a temporary debug key."; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          gradle :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:bundlePlayRelease --stacktrace 2>&1 | tee build-log.txt
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk out/AnamorphicDesqueeze.apk
          cp app/build/outputs/bundle/playRelease/*.aab out/AnamorphicDesqueeze-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: AnamorphicDesqueeze
          path: out/*
      - name: Publish APK to apk branch
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir /tmp/a && cp out/AnamorphicDesqueeze.apk /tmp/a/
          if [ -n "$KEYSTORE_PASSWORD" ]; then echo release > /tmp/a/signing.txt; else echo debug > /tmp/a/signing.txt; fi
          cd /tmp/a && git init -q -b apk && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "apk ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
      - name: Create GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp out/AnamorphicDesqueeze.apk "AnamorphicDesqueeze-${GITHUB_REF_NAME}.apk"
          cp out/AnamorphicDesqueeze-play.aab "AnamorphicDesqueeze-${GITHUB_REF_NAME}-play.aab"
          # Release notes = this version's section of CHANGELOG.md (heading line excluded) + install footer
          awk -v tag="$GITHUB_REF_NAME" '/^## /{p=($2==tag); next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See [CHANGELOG.md](https://github.com/jemishmayani/Anamorphic-Desqueeze/blob/main/CHANGELOG.md)." > notes.md; fi
          cat .github/release-footer.md >> notes.md
          files=("AnamorphicDesqueeze-${GITHUB_REF_NAME}.apk" "AnamorphicDesqueeze-${GITHUB_REF_NAME}-play.aab")
          title="Anamorphic De-Squeeze ${GITHUB_REF_NAME}"
          # A release made on github.com (which also creates the tag) is filled in rather than duplicated.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$title" --notes-file notes.md
          fi
      - name: Save log on failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          mkdir /tmp/l && cp build-log.txt /tmp/l/ 2>/dev/null || echo "no log" > /tmp/l/build-log.txt
          cd /tmp/l && git init -q -b build-logs && git add -A
          git -c user.name=ci -c user.email=ci@x commit -qm "log ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-logs
